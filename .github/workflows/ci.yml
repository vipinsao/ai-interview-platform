name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    # A throwaway PostgreSQL so tests/sql.test.js can apply supabase/schema.sql
    # and check the privileges, the atomic rate limiter and the idempotent
    # credit grant. Without it that suite skips and those guarantees go
    # unchecked on every push.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Reports known advisories without gating the build. `npm audit` queries a
      # live database, so a HIGH can appear with no change to this repository -
      # a red build caused by someone else's disclosure schedule is noise, not
      # signal. It stays visible in the log; it just does not fail the run.
      - run: npm audit --audit-level=high
        continue-on-error: true

      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

      # `next build` prerenders pages that import the Supabase browser client,
      # which refuses to start without its two public variables. These are
      # syntactically valid placeholders, not secrets: the build never makes a
      # network call, so no real project is needed to prove the app compiles.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_HOST_URL: http://localhost:3000
